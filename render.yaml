services:
  - type: web
    name: ntek
    env: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://formsubmit.co; script-src 'self' 'sha256-3cdcbWoBiCc3VQwRz3FplX2bycXjC/BefXYaRuJCqYQ=' 'sha256-6+PMNV4PVN31naWUEyP/eLxhnSRKlHX5rGMCk4wtHCA=' 'sha256-8IunCu0z4FnzVSM/VTHFDGBCFTNPJuHdkmAUdGxjRgY=' 'sha256-BHpmzURi/mZK0m1HBoIccRGazZKRa1Lryxt7v4xyv2w=' 'sha256-RNSwuYLCujRdEE8z7XcFjz+vBt8YnEW3+56TKV7vxVI=' 'sha256-TiPh3fdQRZCG/RjIQXFP2TtQd5JA4QqG6b1Xr+0i+/8=' 'sha256-Upn8rtj7Mk5W2zQ8dHMuFjD23lDr6qqUAaGAXGVrLnM=' 'sha256-WdH941qJcBMEuISa6GfwA6sa7Jgg5di23VIQu0xtizg=' 'sha256-XuhUQihVDofIZ5YwbGSwiq+8HfPBj0SuF1W2UXQST6k=' 'sha256-aK1FIRCdukCwM73CEA+3E7JuCe+cf+lOU8X1j/ictls=' 'sha256-gwv5F/uCVWfdP4Z4W6feLl+0vUy6UoTskXuCqcwfwtU=' 'sha256-sMVWsj6c9EdxTeUq25DICCsf+lfYxDN60hsO7JUwrRc=' 'sha256-y1ay3xJzhTK5f02M+DWpc9e/22rYcD4UZveJrJZlyrs=' https://unpkg.com https://cdnjs.cloudflare.com https://esm.sh https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss://goqovtiffajnslsyuwbg.supabase.co; frame-src https://challenges.cloudflare.com https://www.google.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; upgrade-insecure-requests;"
    routes:
      # Dashboard routes
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /dashboard/*
        destination: /dashboard.html
      - type: redirect
        source: /mail
        destination: /dashboard
      - type: redirect
        source: /mail/
        destination: /dashboard
      - type: rewrite
        source: /login
        destination: /dashboard.html

      # El índice independiente del blog se consolidó en la sección de guías.
      - type: redirect
        source: /blog
        destination: /guias
      - type: redirect
        source: /blog/
        destination: /guias

      # SEO redirects
      - type: redirect
        source: /diagnostico.html
        destination: /diagnostico-digital
      - type: redirect
        source: /diagnostico-digital-pymes
        destination: /diagnostico-digital
      - type: redirect
        source: /diagn%C3%B3stico-digital-pymes.html
        destination: /diagnostico-digital
      - type: redirect
        source: /paginas-web-presencia-digital
        destination: /servicios
      - type: redirect
        source: /automatizacion-procesos-pymes
        destination: /servicios
      - type: redirect
        source: /soporte-mantencion-digital
        destination: /servicios/soporte-infraestructura
      - type: redirect
        source: /camaras-seguridad
        destination: /servicios/soporte-infraestructura
      - type: redirect
        source: /nosotros
        destination: /servicios
      - type: redirect
        source: /servicios-puntuales
        destination: /servicios/soporte-infraestructura
      - type: redirect
        source: /planes
        destination: /servicios
      - type: redirect
        source: /pricing
        destination: /servicios

      # Client portal routes
      - type: redirect
        source: /proyecto.html
        destination: /proyecto
      - type: redirect
        source: /project
        destination: /proyecto
      - type: redirect
        source: /project/
        destination: /proyecto
      - type: redirect
        source: /proyecto/
        destination: /proyecto
      - type: rewrite
        source: /proyecto
        destination: /proyecto.html
      - type: rewrite
        source: /proyecto/*
        destination: /proyecto.html
      - type: rewrite
        source: /project/*
        destination: /proyecto.html
      
      # SPA fallback - must be last
      - type: rewrite
        source: /*
        destination: /index.html
