<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1400" viewBox="0 0 600 1400" role="img" aria-labelledby="title desc"><title id="title">El fondo correcto empieza por el encaje</title><desc id="desc">No todos los instrumentos acompañan la misma etapa. Quién: Comprueba la entidad o persona elegible.. Para qué: Relaciona el objetivo con tu proyecto.. Cómo: Revisa gastos, aportes y entregables.</desc>
