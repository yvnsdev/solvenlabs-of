stroke-width="2"/><text x="300" y="262" font-size="19" fill="#17364e" font-weight="400" text-anchor="start">Errores</text><path d="M300 280h170" fill="none" stroke="#dae5eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><circle cx="468" cy="258" r="8" fill="#fff" stroke="#476d92" stroke-width="2"/><path d="M129 329v35h262v-35M260 364v34" fill="none" stroke="#476d92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><rect x="80" y="400" width="360" height="74" rx="16" fill="#17364e" stroke="none"/><text x="260" y="444" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">Mismos casos. Mismo criterio.</text></g>
