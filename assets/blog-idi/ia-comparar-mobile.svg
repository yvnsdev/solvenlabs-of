<text x="40" y="77" font-size="15" fill="#476d92" font-weight="700" text-anchor="start">EVALUACIÓN DE IA</text>
<text x="40" y="134" font-size="38" fill="#17364e" font-weight="700" text-anchor="start">La pregunta es: ¿mejora</text>
<text x="40" y="182.64" font-size="38" fill="#17364e" font-weight="700" text-anchor="start">la tarea?</text>
<text x="40" y="245.27999999999997" font-size="21" fill="#506b7e" font-weight="400" text-anchor="start">Antes de celebrar la respuesta, define cómo</text>
<text x="40" y="272.15999999999997" font-size="21" fill="#506b7e" font-weight="400" text-anchor="start">la vas a evaluar.</text>
