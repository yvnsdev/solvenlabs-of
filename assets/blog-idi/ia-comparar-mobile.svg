<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1400" viewBox="0 0 600 1400" role="img" aria-labelledby="title desc"><title id="title">La pregunta es: ¿mejora la tarea?</title><desc id="desc">Antes de celebrar la respuesta, define cómo la vas a evaluar. Referencia: Mide cómo se hace hoy.. Prueba: Usa casos representativos.. Decisión: Compara calidad, tiempo y errores.</desc>
