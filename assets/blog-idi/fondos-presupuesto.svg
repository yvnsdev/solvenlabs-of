<text x="816" y="455" fill="#16384f" font-size="26" font-weight="700">Evidencia</text><text x="816" y="491" fill="#526e80" font-size="21" font-weight="400">¿Cómo mostrarás el</text><text x="816" y="517.67" fill="#526e80" font-size="21" font-weight="400">resultado?</text><path d="M60 603h1080" stroke="#cddde5"/><text x="60" y="638" fill="#3b6579" font-size="19" font-weight="400">Una cadena clara entre trabajo, recursos y resultados.</text><text x="1080" y="638" fill="#087e99" font-size="16" font-weight="700">I+D</text></g></svg>
