<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Un presupuesto cuenta una historia</title><desc id="desc">Cada gasto debe tener una relación visible con el trabajo. Actividad: ¿Qué vas a hacer? Recurso: ¿Qué necesitas para hacerlo? Evidencia: ¿Cómo mostrarás el resultado?</desc>
<defs>
<linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f9fcfd"/><stop offset="1" stop-color="#eaf2f6"/></linearGradient>
<linearGradient id="night" x2="1" y2="1"><stop stop-color="#102d45"/><stop offset="1" stop-color="#061b2b"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#052d45" flood-opacity=".1"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56a4b9" stroke-width="1.5"/></marker>
</defs>
