<text x="450" y="455" fill="#16384f" font-size="26" font-weight="700">Recurso</text><text x="450" y="491" fill="#526e80" font-size="21" font-weight="400">¿Qué necesitas para</text><text x="450" y="517.67" fill="#526e80" font-size="21" font-weight="400">hacerlo?</text><path d="M751 292h34" stroke="#56a4b9" stroke-width="2" marker-end="url(#arrow)"/><circle cx="820" cy="292" r="18" fill="#087e99" stroke="#087e99" stroke-width="2"/><text x="810" y="298" fill="#fff" font-size="14" font-weight="700">03</text>
