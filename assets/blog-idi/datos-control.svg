<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">No todo vacío significa cero</title><desc id="desc">Tres preguntas pequeñas que evitan conclusiones grandes y equivocadas. Significado: ¿No se midió o el resultado fue cero?. Unidad: ¿Horas, minutos o segundos?. Identidad: ¿Una persona o varias observaciones?</desc>
