<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1400" viewBox="0 0 600 1400" role="img" aria-labelledby="title desc"><title id="title">Tres salidas posibles, no solo responder</title><desc id="desc">Diseñar límites también es diseñar la experiencia. Responder: Existe información suficiente y verificable.. Pedir contexto: Faltan datos para completar la tarea.. Escalar: Una persona debe revisar la decisión.</desc>
<rect x="0" y="0" width="600" height="1400" rx="0" fill="#f4f7fa" stroke="none"/>
<g font-family="Arial, Helvetica, sans-serif">
<path d="M40 43h34" fill="none" stroke="#476d92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<text x="40" y="77" font-size="15" fill="#476d92" font-weight="700" text-anchor="start">SUPERVISIÓN HUMANA</text>
<text x="40" y="134" font-size="38" fill="#17364e" font-weight="700" text-anchor="start">Tres salidas posibles, no</text>
<text x="40" y="182.64" font-size="38" fill="#17364e" font-weight="700" text-anchor="start">solo responder</text>
<text x="40" y="245.27999999999997" font-size="21" fill="#506b7e" font-weight="400" text-anchor="start">Diseñar límites también es diseñar la</text>
<text x="40" y="272.15999999999997" font-size="21" fill="#506b7e" font-weight="400" text-anchor="start">experiencia.</text>
<g transform="translate(40 330)"><path d="M260 18 390 85 260 152 130 85Z" fill="#e5f1f4" stroke="#476d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="260" y="91" font-size="20" fill="#17364e" font-weight="700" text-anchor="middle">Evaluar la solicitud</text><path d="M260 152v33H58v204M58 278h42M58 389h42M58 185h42" fill="none" stroke="#476d92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><rect x="104" y="164" width="390" height="84" rx="16" fill="#ffffff" stroke="#d6e3eb"/><text x="125" y="196" font-size="23" fill="#476d92" font-weight="700" text-anchor="start">Responder</text><text x="125" y="225" font-size="18" fill="#17364e" font-weight="400" text-anchor="start">Información verificable</text><rect x="104" y="266" width="390" height="84" rx="16" fill="#ffffff" stroke="#d6e3eb"/><text x="125" y="298" font-size="23" fill="#476d92" font-weight="700" text-anchor="start">Pedir contexto</text><text x="125" y="327" font-size="18" fill="#17364e" font-weight="400" text-anchor="start">Faltan antecedentes</text><rect x="104" y="368" width="390" height="84" rx="16" fill="#ffffff" stroke="#d6e3eb"/><text x="125" y="400" font-size="23" fill="#476d92" font-weight="700" text-anchor="start">Escalar</text><text x="125" y="429" font-size="18" fill="#17364e" font-weight="400" text-anchor="start">Requiere revisión humana</text></g>
<circle cx="53" cy="894" r="13" fill="#dce8ef" stroke="none" stroke-width="2"/>
<text x="53" y="899" font-size="13" fill="#476d92" font-weight="700" text-anchor="middle">1</text>
<text x="80" y="900" font-size="21" fill="#17364e" font-weight="700" text-anchor="start">Responder</text>
<text x="80" y="928" font-size="18" fill="#506b7e" font-weight="400" text-anchor="start">Existe información suficiente y verificable.</text>
<circle cx="53" cy="1017" r="13" fill="#dce8ef" stroke="none" stroke-width="2"/>
<text x="53" y="1022" font-size="13" fill="#476d92" font-weight="700" text-anchor="middle">2</text>
<text x="80" y="1023" font-size="21" fill="#17364e" font-weight="700" text-anchor="start">Pedir contexto</text>
<text x="80" y="1051" font-size="18" fill="#506b7e" font-weight="400" text-anchor="start">Faltan datos para completar la tarea.</text>
<circle cx="53" cy="1140" r="13" fill="#dce8ef" stroke="none" stroke-width="2"/>
<text x="53" y="1145" font-size="13" fill="#476d92" font-weight="700" text-anchor="middle">3</text>
<text x="80" y="1146" font-size="21" fill="#17364e" font-weight="700" text-anchor="start">Escalar</text>
<text x="80" y="1174" font-size="18" fill="#506b7e" font-weight="400" text-anchor="start">Una persona debe revisar la decisión.</text>
<path d="M40 1343H560" fill="none" stroke="#d2dfe7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<text x="40" y="1371" font-size="14" fill="#506b7e" font-weight="400" text-anchor="start">La respuesta correcta también puede ser pedir ayuda.</text>
</g></svg>