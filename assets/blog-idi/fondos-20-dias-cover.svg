  <g font-family="Arial,sans-serif"><g transform="translate(140 405)"><circle cx="18" cy="18" r="18" fill="#f39a54"/><text x="52" y="26" fill="#173b55" font-size="22" font-weight="700">01  Encaje</text><text x="52" y="54" fill="#6b8090" font-size="16">¿La convocatoria calza?</text></g><g transform="translate(430 405)"><circle cx="18" cy="18" r="18" fill="#f39a54"/><text x="52" y="26" fill="#173b55" font-size="22" font-weight="700">02  Evidencia</text><text x="52" y="54" fill="#6b8090" font-size="16">¿Qué puedes demostrar?</text></g><g transform="translate(770 405)"><circle cx="18" cy="18" r="18" fill="#f39a54"/><text x="52" y="26" fill="#173b55" font-size="22" font-weight="700">03  Revisión</text><text x="52" y="54" fill="#6b8090" font-size="16">¿Qué falta antes de enviar?</text></g></g>
