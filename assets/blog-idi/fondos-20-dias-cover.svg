  <path d="M90 124h1020a24 24 0 0 1 24 24v390a24 24 0 0 1-24 24H90z" fill="url(#card)"/>
  <rect x="90" y="124" width="1020" height="92" rx="24" fill="#16a89b"/><rect x="90" y="192" width="1020" height="24" fill="#16a89b"/>
