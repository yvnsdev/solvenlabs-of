<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>Tres salidas posibles, no solo responder</title><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a4d9ec" stroke-opacity=".09"/></pattern></defs><rect width="1200" height="680" rx="28" fill="#101e2c"/><rect width="1200" height="680" fill="url(#g)"/><circle cx="1110" cy="100" r="210" fill="#162e48"/><text x="64" y="72" font-family="sans-serif" font-size="18" letter-spacing="4" fill="#9edcf2">Solven Labs / CUADERNO I+D+i</text><text x="64" y="140" font-family="sans-serif" font-size="43" font-weight="700" fill="#fff">Tres salidas posibles, no solo responder</text><text x="64" y="250" font-family="sans-serif" font-size="21" fill="#b4cfd9">Diseñar límites también es diseñar la experiencia.</text><rect x="64" y="305" width="340" height="255" rx="22" fill="#f1f7f9"/><circle cx="109" cy="350" r="23" fill="#c5e6f2"/><text x="109" y="358" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="23" fill="#123a64">1</text><text x="88" y="410" font-family="sans-serif" font-size="25" font-weight="700" fill="#172a3e">Responder</text><text x="88" y="450" font-family="sans-serif" font-size="21" fill="#3a5572">Existe información</text><text x="88" y="479" font-family="sans-serif" font-size="21" fill="#3a5572">suficiente y verificable.</text><path d="M408 433h17m-7-7 7 7-7 7" fill="none" stroke="#93d4eb" stroke-width="3"/><rect x="429" y="305" width="340" height="255" rx="22" fill="#f1f7f9"/><circle cx="474" cy="350" r="23" fill="#c5e6f2"/><text x="474" y="358" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="23" fill="#123a64">2</text><text x="453" y="410" font-family="sans-serif" font-size="25" font-weight="700" fill="#172a3e">Pedir contexto</text><text x="453" y="450" font-family="sans-serif" font-size="21" fill="#3a5572">Faltan datos para</text><text x="453" y="479" font-family="sans-serif" font-size="21" fill="#3a5572">completar la tarea.</text><path d="M773 433h17m-7-7 7 7-7 7" fill="none" stroke="#93d4eb" stroke-width="3"/><rect x="794" y="305" width="340" height="255" rx="22" fill="#f1f7f9"/><circle cx="839" cy="350" r="23" fill="#c5e6f2"/><text x="839" y="358" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="23" fill="#123a64">3</text><text x="818" y="410" font-family="sans-serif" font-size="25" font-weight="700" fill="#172a3e">Escalar</text><text x="818" y="450" font-family="sans-serif" font-size="21" fill="#3a5572">Una persona debe revisar</text><text x="818" y="479" font-family="sans-serif" font-size="21" fill="#3a5572">la decisión.</text><text x="64" y="628" font-family="sans-serif" font-size="18" fill="#8ab4c3">Una idea se vuelve proyecto cuando puedes explicar qué vas a comprobar.</text></svg>