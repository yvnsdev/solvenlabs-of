<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">El fondo correcto empieza por el encaje</title><desc id="desc">No todos los instrumentos acompañan la misma etapa. Quién: Comprueba la entidad o persona elegible.. Para qué: Relaciona el objetivo con tu proyecto.. Cómo: Revisa gastos, aportes y entregables.</desc>
