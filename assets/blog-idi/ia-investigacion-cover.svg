<text x="60" y="152" fill="#65d8d0" font-size="15" font-weight="700">INTELIGENCIA ARTIFICIAL</text><text x="60" y="220" fill="#fff" font-size="49" font-weight="700">La evidencia antes que</text><text x="60" y="282.23" fill="#fff" font-size="49" font-weight="700">la respuesta</text>
<text x="60" y="448" fill="#aec9d9" font-size="23" font-weight="400">Una IA útil también debe demostrar</text><text x="60" y="477.21" fill="#aec9d9" font-size="23" font-weight="400">su aporte.</text>
